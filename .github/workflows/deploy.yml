name: Deploy to InfinityFree

on:
  push:
    branches: [ "main" ]   # Deploy whenever you push to main

jobs:
  ftp-deploy:
    name: Upload WordPress to InfinityFree via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./    # deploy everything in repo
          server-dir: /htdocs/   # InfinityFree default directory
          timeout: 100000
          log-level: verbose
